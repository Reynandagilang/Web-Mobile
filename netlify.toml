[build]
  publish = "."

[[headers]]
  for = "/*"
    [headers.values]
    Service-Worker-Allowed = "/"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"
